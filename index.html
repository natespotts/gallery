<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Nathan Spotts – Horizontal Gallery</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Flickity CSS -->
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/flickity@2/dist/flickity.min.css" />

  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #000;
      color: #f5f5f5;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .gallery-wrapper {
      width: 100vw;
      margin: 0;
      padding: 0;
    }

    .main-carousel {
      width: 100vw;
    }

    /* Each slide spans full width; height auto */
    .carousel-cell {
      width: 100vw;
      margin-right: 0;
      background: #000;
      text-align: center;
    }

    /* Image is fully visible inside viewport */
    .carousel-cell img {
      display: block;
      max-width: 100vw;
      max-height: 1100px;
      width: auto;
      height: auto;
      margin: 0 auto;
    }

    .flickity-page-dots {
      bottom: 10px;
    }
  </style>
</head>
<body>

  <div class="gallery-wrapper">
    <div class="main-carousel"
         data-flickity='{
           "cellAlign": "left",
           "contain": true,
           "wrapAround": true,
           "lazyLoad": 2,
           "imagesLoaded": true,
           "prevNextButtons": true,
           "pageDots": true,
           "draggable": true
         }'>

      <!-- SLIDE 1 -->
      <div class="carousel-cell">
        <img data-flickity-lazyload="Art_Folio_2026_01.jpg"
