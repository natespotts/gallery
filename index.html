<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Nathan Spotts – Horizontal Gallery</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Flickity CSS (via jsDelivr CDN) -->
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/flickity@2/dist/flickity.min.css" />

  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #000;
      color: #f5f5f5;
      height: 100%;
    }

    /* Wrapper is full viewport width */
    .gallery-wrapper {
      width: 100vw;
      height: 100vh; /* full-screen; iframe height controls visible area */
      margin: 0;
      padding: 0;
    }

    /* Flickity container */
    .main-carousel {
      width: 100vw;
      height: 100vh;
    }

    /* Each slide = full viewport */
    .carousel-cell {
      width: 100vw;
      height: 100vh;
      margin-right: 0;
      background: #000;
      overflow: hidden;
      position: relative;
    }

    /* Image fills slide, cropped as needed */
    .carousel-cell img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;  /* change to 'contain' if you don’t want cropping */
    }

    /* Optional: captions, bottom-left */
    .caption {
      position: absolute;
      left: 16px;
      bottom: 16px;
      padding: 6px 10px;
      font-size: 0.8rem;
      color: #eee;
      background: rgba(0, 0, 0, 0.45);
      border-radius: 4px;
    }

    /* Optional: tweak dots position */
    .flickity-page-dots {
      bottom: 12px;
    }

    /* Optional: larger arrows on desktop */
    @media (min-width: 768px) {
      .flickity-prev-next-button {
        width: 44px;
        height: 44px;
      }
    }
  </style>
</head>
<body>

  <div class="gallery-wrapper">
    <div class="main-carousel"
         data-flickity='{
           "cellAlign": "left",
           "contain": false,
           "wrapAround": true,
           "lazyLoad": 2,
           "imagesLoaded": true,
           "prevNextButtons": true,
           "pageDots": true,
           "draggable": true,
           "setGallerySize": false
         }'>

      <!-- SLIDE 1 -->
      <div class="carousel-cell">
        <img data-flickity-lazyload="images/image-01.jpg"
             alt="Description of image 01">
        <!-- <div class="caption">Optional caption text</div> -->
      </div>

      <!-- SLIDE 2 -->
      <div class="carousel-cell">
        <img data-flickity-lazyload="images/image-02.jpg"
             alt="Description of image 02">
      </div>

      <!-- SLIDE 3 -->
      <div class="carousel-cell">
        <img data-flickity-lazyload="images/image-03.jpg"
             alt="Description of image 03">
      </div>

      <!-- Add more .carousel-cell blocks as needed -->

    </div>
  </div>

  <!-- Flickity JS (via jsDelivr CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/flickity@2/dist/flickity.pkgd.min.js"></script>
</body>
</html>
