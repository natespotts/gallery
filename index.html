<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Nathan Spotts – Horizontal Gallery</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Flickity CSS -->
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/flickity@2/dist/flickity.min.css" />

  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #000;
      color: #f5f5f5;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .gallery-wrapper {
      width: 100vw;
      margin: 0;
      padding: 0;
    }

    .main-carousel {
      width: 100vw;
    }

    /* Each slide spans full width; height auto */
    .carousel-cell {
      width: 100vw;
      margin-right: 0;
      background: #000;
      text-align: center;
    }

    /* Image is fully visible inside viewport */
    .carousel-cell img {
      display: block;
      max-width: 100vw;
      max-height: 100vh;
      width: auto;
      height: auto;
      margin: 0 auto;
    }

    .flickity-page-dots {
      bottom: 10px;
    }
  </style>
</head>
<body>

  <div class="gallery-wrapper">
    <div class="main-carousel"
         data-flickity='{
           "cellAlign": "left",
           "contain": true,
           "wrapAround": true,
           "lazyLoad": 2,
           "imagesLoaded": true,
           "prevNextButtons": true,
           "pageDots": true,
           "draggable": true
         }'>

      <!-- SLIDE 1 -->
      <div class="carousel-cell">
        <img data-flickity-lazyload="Art_Folio_2026_01.jpg"
             alt="Description of image 01">
        <!-- <div class="caption">Optional caption text</div> -->
      </div>

      <!-- SLIDE 2 -->
      <div class="carousel-cell">
        <img data-flickity-lazyload="Art_Folio_2026_02.jpg"
             alt="Description of image 02">
      </div>

      <!-- SLIDE 3 -->
      <div class="carousel-cell">
        <img data-flickity-lazyload="Art_Folio_2026_03.jpg"
             alt="Description of image 03">
      </div>

      <!-- Add more .carousel-cell blocks as needed -->

    </div>
  </div>

  <!-- Flickity JS (via jsDelivr CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/flickity@2/dist/flickity.pkgd.min.js"></script>
</body>
</html>
