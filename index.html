<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Nathan Spotts – Horizontal Gallery</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Flickity CSS (via jsDelivr CDN) -->
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/flickity@2/dist/flickity.min.css" />

  <style>
   html, body {
  margin: 0;
  padding: 0;
  background: #000;
  color: #f5f5f5;
  height: 100%;
}

/* full viewport width, but let height be driven by the image */
.gallery-wrapper {
  width: 100vw;
  margin: 0;
  padding: 0;
}

/* Flickity container */
.main-carousel {
  width: 100vw;
}

/* each slide = full width, flex‑centers the image */
.carousel-cell {
  width: 100vw;
  margin-right: 0;
  background: #000;
  overflow: hidden;

  display: flex;
  align-items: center;
  justify-content: center;

  /* optional: cap height so you don't get monster vertical frames */
  min-height: 50vh;
  max-height: 100vh;
}

/* image fully fits inside the cell */
.carousel-cell img {
  display: block;
  max-width: 100%;
  max-height: 100vh;
  width: auto;
  height: auto;
  object-fit: contain;  /* no cropping */
}
    }
  </style>
</head>
<body>

  <div class="gallery-wrapper">
    <div class="main-carousel"
         data-flickity='{
           "cellAlign": "left",
           "contain": false,
           "wrapAround": true,
           "lazyLoad": 2,
           "imagesLoaded": true,
           "prevNextButtons": true,
           "pageDots": true,
           "draggable": true,
           "setGallerySize": false
         }'>

      <!-- SLIDE 1 -->
      <div class="carousel-cell">
        <img data-flickity-lazyload="Art_Folio_2026_01.jpg"
             alt="Description of image 01">
        <!-- <div class="caption">Optional caption text</div> -->
      </div>

      <!-- SLIDE 2 -->
      <div class="carousel-cell">
        <img data-flickity-lazyload="Art_Folio_2026_02.jpg"
             alt="Description of image 02">
      </div>

      <!-- SLIDE 3 -->
      <div class="carousel-cell">
        <img data-flickity-lazyload="Art_Folio_2026_03.jpg"
             alt="Description of image 03">
      </div>

      <!-- Add more .carousel-cell blocks as needed -->

    </div>
  </div>

  <!-- Flickity JS (via jsDelivr CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/flickity@2/dist/flickity.pkgd.min.js"></script>
</body>
</html>
