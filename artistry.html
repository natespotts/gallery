<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Nathan Spotts – Horizontal Gallery</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Flickity CSS -->
  
        href="https://unpkg.com/flickity@2/dist/flickity.min.css">

  <style>
    /* Page background + centering */
    html, body {
  margin: 0;
  padding: 0;
  background: #000;
  color: #f5f5f5;
}

/* no max-width wrapper – let it touch the edges */
.gallery-wrapper {
  width: 100vw;
  margin: 0;
  padding: 0;
}

/* each slide = full viewport width */
.main-carousel {
  width: 100vw;
}

.carousel-cell {
  width: 100vw;
  height: 100vh;          /* full-screen height; adjust if you want shorter */
  margin-right: 0;        /* no gutters, truly full bleed */
  background: #000;
}

/* image fills the slide, cropped if necessary */
.carousel-cell img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;      /* use 'contain' if you don’t want any cropping */
}

/* optional: hide dots if you want a cleaner, pure-image experience */
.flickity-page-dots {
  bottom: 16px;
}
*/
  </style>
</head>
<body>

  <div class="gallery-wrapper">
    <div class="main-carousel"
         data-flickity='{
           "cellAlign": "left",
           "contain": true,
           "wrapAround": true,
           "lazyLoad": 2,
           "imagesLoaded": true,
           "prevNextButtons": true,
           "pageDots": true,
           "draggable": true,
           "setGallerySize": true
         }'>

      <!-- SLIDE 1 -->
      <div class="carousel-cell">
        <img data-flickity-lazyload="images/image-01.jpg"
             alt="Description of image 01">
        <!-- <div class="caption">Optional caption</div> -->
      </div>

      <!-- SLIDE 2 -->
      <div class="carousel-cell">
        <img data-flickity-lazyload="images/image-02.jpg"
             alt="Description of image 02">
      </div>

      <!-- SLIDE 3 -->
      <div class="carousel-cell">
        <img data-flickity-lazyload="images/image-03.jpg"
             alt="Description of image 03">
      </div>

      <!-- Add more .carousel-cell blocks as needed -->

    </div>
  </div>

  <!-- Flickity JS -->
  <script src="https://unpkg.com/flickity@2/dist/flickity.pkgd.min.js"></script>
</body>
</html>
